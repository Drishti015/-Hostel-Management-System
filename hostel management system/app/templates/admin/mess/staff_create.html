{% extends 'base.html' %}

{% block title %}Provision Counter Staff Account{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold text-dark mb-1">
                    <i class="fa-solid fa-user-plus text-primary me-2"></i>Provision Mess Staff
                </h2>
                <p class="text-muted small mb-0">Create credentials for staff authorized to operate QR scanning terminals.</p>
            </div>
            <a href="{{ url_for('admin.mess_dashboard') }}" class="btn btn-outline-secondary">
                <i class="fa-solid fa-arrow-left me-1"></i>Back
            </a>
        </div>

        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
            <form method="POST" action="{{ url_for('admin.mess_staff_create') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label small fw-semibold text-secondary">Full Name *</label>
                        <input type="text" name="full_name" class="form-control" placeholder="e.g. Mohan Verma" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold text-secondary">Username *</label>
                        <input type="text" name="username" class="form-control" placeholder="e.g. staff_mohan" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold text-secondary">Email Address *</label>
                        <input type="email" name="email" class="form-control" placeholder="e.g. mohan@mess.hostelease.internal" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label small fw-semibold text-secondary">Account Password *</label>
                        <input type="password" name="password" class="form-control" placeholder="Enter secure password" required minlength="6">
                    </div>

                    <div class="col-12">
                        <label class="form-label small fw-semibold text-secondary">Assigned Dining Facility</label>
                        <select name="mess_id" class="form-select">
                            <option value="">-- Campus Wide (Any Mess) --</option>
                            {% for m in messes %}
                            <option value="{{ m.id }}">{{ m.mess_name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-semibold text-secondary">Designation</label>
                        <input type="text" name="role_designation" class="form-control" value="QR Counter Attendant">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold text-secondary">Shift Timings</label>
                        <input type="text" name="shift_timing" class="form-control" value="Morning & Evening Shift">
                    </div>

                    <div class="col-12 mt-4">
                        <button type="submit" class="btn btn-primary-custom w-100 py-2">
                            <i class="fa-solid fa-check me-2"></i>Create Staff Account
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
