{% extends 'base.html' %}

{% block title %}Register Pantry Stock Item{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold text-dark mb-1">
                    <i class="fa-solid fa-cart-plus text-primary me-2"></i>Register Inventory Item
                </h2>
                <p class="text-muted small mb-0">Add raw food materials, groceries, or kitchen supplies to the pantry system.</p>
            </div>
            <a href="{{ url_for('mess_manager.inventory_list') }}" class="btn btn-outline-secondary">
                <i class="fa-solid fa-arrow-left me-1"></i>Back
            </a>
        </div>

        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
            <form method="POST" action="{{ url_for('mess_manager.inventory_add') }}">
                <div class="row g-3">
                    <div class="col-md-8">
                        <label class="form-label small fw-semibold text-secondary">Item Name *</label>
                        <input type="text" name="item_name" class="form-control" placeholder="e.g. Basmati Rice, Mustard Oil..." required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-semibold text-secondary">Category *</label>
                        <select name="category" class="form-select" required>
                            <option value="Grains & Cereals">Grains & Cereals</option>
                            <option value="Vegetables">Vegetables</option>
                            <option value="Dairy">Dairy</option>
                            <option value="Spices & Oils">Spices & Oils</option>
                            <option value="Pulses & Legumes">Pulses & Legumes</option>
                            <option value="Snacks & Beverages">Snacks & Beverages</option>
                            <option value="Gas & Kitchen Supplies">Gas & Kitchen Supplies</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label small fw-semibold text-secondary">Initial Stock Quantity *</label>
                        <input type="number" step="0.01" name="quantity" class="form-control" value="0.00" required min="0">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-semibold text-secondary">Unit of Measurement *</label>
                        <select name="unit" class="form-select" required>
                            <option value="kg">kg (Kilograms)</option>
                            <option value="litres">litres (Litres)</option>
                            <option value="packets">packets</option>
                            <option value="pieces">pieces</option>
                            <option value="tins">tins</option>
                            <option value="cylinders">cylinders</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-semibold text-secondary">Min Stock Alert Level *</label>
                        <input type="number" step="0.01" name="minimum_stock_level" class="form-control" value="10.00" required min="0">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-semibold text-secondary">Purchase Price per Unit (₹)</label>
                        <input type="number" step="0.01" name="purchase_price" class="form-control" value="0.00" min="0">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold text-secondary">Expiry Date (Optional)</label>
                        <input type="date" name="expiry_date" class="form-control">
                    </div>

                    <div class="col-md-12">
                        <label class="form-label small fw-semibold text-secondary">Primary Vendor / Supplier</label>
                        <select name="supplier_id" class="form-select">
                            <option value="">-- Direct Retail / Local Market --</option>
                            {% for sup in suppliers %}
                            <option value="{{ sup.id }}">{{ sup.supplier_name }} ({{ sup.contact_person }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-12 mt-4">
                        <button type="submit" class="btn btn-primary-custom w-100 py-2">
                            <i class="fa-solid fa-check me-2"></i>Register Stock Item
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
